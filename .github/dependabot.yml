# Weekly dependency updates (tech-stack.md §12 G8); the owner reviews each PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Typings stay on Node 24 (`engines`, tech-stack.md §2).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
