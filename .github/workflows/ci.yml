# Pull-request checks (tech-stack.md §12 ci.yml, G4, G7). Runs `pnpm verify`
# as one step so CI and the local check cannot drift apart, then the database
# integration tests against postgres:17 and Mailpit service containers and
# Azurite (a docker run step). No Playwright and
# no secrets: the build must pass without them (Sprint 0 proof 3, W1), so the
# database URL and the configuration are set only on the steps that need them,
# never on the job or the build step. The values below are obviously fake,
# CI-only test values (AGENTS.md "Commits").
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ats
          POSTGRES_PASSWORD: local-only-not-secret-postgres
          POSTGRES_DB: ats
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ats -d ats"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      # Email integration tests read real messages through its API (§9).
      mailpit:
        image: axllent/mailpit:v1
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v7

      # Version comes from package.json `packageManager`.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      # Azurite for the storage integration tests (tech-stack.md §8). Started
      # here rather than as a service container, because a service can't take
      # a command and the SDK's API version needs --skipApiVersionCheck. Same
      # image and command as docker-compose.yml (a unit test keeps them equal).
      - name: Start Azurite
        run: >-
          docker run -d --name azurite -p 10000:10000
          mcr.microsoft.com/azure-storage/azurite:3.37.0
          azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck

      # db:migrate validates the whole configuration (getConfig()), so it gets
      # the same kind of fake values as docker-compose.yml.
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://ats:local-only-not-secret-postgres@localhost:5432/ats
          APP_ENV: ci
          BETTER_AUTH_SECRET: local-only-not-secret-better-auth
          BETTER_AUTH_URL: http://localhost:3000
          EMAIL_HASH_KEY: local-only-not-secret-email-hash
          EMAIL_PROVIDER: smtp
          SMTP_HOST: localhost
          SMTP_PORT: "1025"
          AZURE_STORAGE_CONNECTION_STRING: UseDevelopmentStorage=true
          TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          TICK_SECRET: local-only-not-secret-tick

      # Each worker clones a freshly migrated template database (T2).
      - run: pnpm test:integration --reporter=verbose
        env:
          DATABASE_URL: postgres://ats:local-only-not-secret-postgres@localhost:5432/ats

      # Next.js build cache (G4): exact hit when lockfile and sources are
      # unchanged, otherwise fall back to the latest cache for this lockfile.
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'messages/**', 'public/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # W1: no database and no configuration in this step's environment.
      - run: pnpm build
