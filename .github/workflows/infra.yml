# Azure infrastructure (tech-stack.md §12 infra.yml, G3, G5, G6; task 44).
# Manual only, and only from main: the federated credential accepts runs on
# main and nothing else (Q11), and the first step refuses other refs.
#
#   mode: what-if  runs `az deployment group what-if` and writes the result to
#                  the job summary. Deploys nothing.
#   mode: deploy   runs the same what-if, prints it, then
#                  `az deployment group create`; after a `full` deployment it
#                  runs the db-migrate job and waits for GET /api/health = 200.
#
# The approval step is the owner reading a what-if run before starting a
# deploy run (Q1, TO-21). Authentication is OIDC (azure/login); no Azure
# secret exists in GitHub (G3). Settings come from GitHub Actions variables.
# The generated secrets (database passwords, auth secret, email hash key,
# tick secret) are created here once, on the first foundation run, masked,
# and handed to Bicep, which writes them to Key Vault; later runs never
# change them. The owner's secrets are never touched here.
name: infra

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "what-if (dry run) or deploy"
        type: choice
        options: [what-if, deploy]
        default: what-if
      stage:
        description: "foundation (vault, storage, logs, identity, budget) or full (+ database, app, jobs)"
        type: choice
        options: [foundation, full]
        default: foundation
      image_tag:
        description: "Image SHA in GHCR; used only when the web app doesn't exist yet"
        type: string
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra
  cancel-in-progress: false

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  INFRA_STAGE: ${{ inputs.stage }}
  INFRA_MODE: ${{ inputs.mode }}
  IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
  GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
  MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
  TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
  DEMO_USER_DOMAIN: ${{ vars.DEMO_USER_DOMAIN }}
  BUDGET_ALERT_EMAIL: ${{ vars.BUDGET_ALERT_EMAIL }}
  # Optional; empty puts PostgreSQL in the resource group's region.
  POSTGRES_LOCATION: ${{ vars.POSTGRES_LOCATION }}
  AZURE_CORE_NO_COLOR: "true"
  AZURE_CORE_ONLY_SHOW_ERRORS: "true"

jobs:
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Refuse refs other than main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::infra.yml runs only on main (G3); this run is on ${GITHUB_REF}."
          exit 1

      - uses: actions/checkout@v7

      - name: Check the settings
        run: |
          missing=""
          for name in RESOURCE_GROUP GHCR_USERNAME MICROSOFT_CLIENT_ID TURNSTILE_SITE_KEY DEMO_USER_DOMAIN BUDGET_ALERT_EMAIL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions variables (README \"Azure setup\"):$missing"
            exit 1
          fi
          if [ -n "$IMAGE_TAG_INPUT" ] && ! [[ "$IMAGE_TAG_INPUT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::image_tag must be a full commit SHA (40 lower-case hex characters)."
            exit 1
          fi
          if [ -n "$POSTGRES_LOCATION" ] && ! [[ "$POSTGRES_LOCATION" =~ ^[a-z0-9]+$ ]]; then
            echo "::error::POSTGRES_LOCATION must be an Azure region name such as westeurope (lower case, no spaces)."
            exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build the Bicep (no warnings) and check the compiled template
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --outfile infra/main.json 2> bicep.log || { cat bicep.log; exit 1; }
          if grep -q "Warning" bicep.log; then
            cat bicep.log
            echo "::error::az bicep build reported warnings."
            exit 1
          fi
          node infra/check-arm.mjs infra/main.json

      - name: Read the current state
        run: |
          generated="pg-admin-password pg-app-password better-auth-secret email-hash-key tick-secret database-url database-admin-url"
          owner="microsoft-client-secret turnstile-secret-key ghcr-pat"

          # Control-plane reads only: the deploy principal has no Key Vault data access.
          vault_id="$(az resource list -g "$RESOURCE_GROUP" --resource-type Microsoft.KeyVault/vaults \
            --query "[?tags.project=='ats'].id | [0]" -o tsv)"
          # One GET per expected name, not a list call: the ARM secrets list is
          # paged (nextLink) and az rest returns only the first page, which made
          # run #6 see 3 of 7 secrets in a vault that held all 10. 404 = absent;
          # any other error fails the step instead of being counted as absent.
          existing=" "
          if [ -n "$vault_id" ]; then
            for name in $generated $owner; do
              if err="$(az rest --method get --output none \
                  --url "https://management.azure.com${vault_id}/secrets/${name}?api-version=2023-07-01" 2>&1)"; then
                existing="$existing$name "
              elif ! grep -qiE "not ?found|\(404\)" <<< "$err"; then
                echo "$err"
                echo "::error::Couldn't read Key Vault secret $name from the control plane."
                exit 1
              fi
            done
          fi
          echo "Secrets present in Key Vault:$existing"
          # The host the connection strings were written for; main.bicep rewrites
          # them in the full stage when it differs from the current server's.
          stored_host=""
          if [[ "$existing" == *" database-url "* ]]; then
            stored_host="$(az rest --method get --query "tags.postgresHost" --output tsv \
              --url "https://management.azure.com${vault_id}/secrets/database-url?api-version=2023-07-01")"
          fi
          echo "INFRA_STORED_POSTGRES_HOST=$stored_host" >> "$GITHUB_ENV"
          present=0
          for name in $generated; do [[ "$existing" == *" $name "* ]] && present=$((present + 1)); done

          if [ "$present" -eq 0 ]; then
            if [ "$INFRA_STAGE" != "foundation" ]; then
              echo "::error::No generated secrets in Key Vault yet: run stage foundation first."
              exit 1
            fi
            echo "INFRA_CREATE_GENERATED_SECRETS=true" >> "$GITHUB_ENV"
            for var in INFRA_PG_ADMIN_PASSWORD INFRA_PG_APP_PASSWORD INFRA_BETTER_AUTH_SECRET INFRA_EMAIL_HASH_KEY INFRA_TICK_SECRET; do
              # 32 random bytes, base64url: 43 URL-safe characters.
              value="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')"
              echo "::add-mask::$value"
              echo "$var=$value" >> "$GITHUB_ENV"
            done
          elif [ "$present" -lt 7 ]; then
            # The connection strings embed the passwords, so the set is created together.
            echo "::error::Only $present of the 7 generated secrets exist in Key Vault ($generated). Restore the missing ones or delete all 7, then rerun."
            exit 1
          else
            echo "INFRA_CREATE_GENERATED_SECRETS=false" >> "$GITHUB_ENV"
          fi

          if [ "$INFRA_STAGE" = "full" ]; then
            # The server name includes its region (main.bicep), so a run with
            # another POSTGRES_LOCATION would create a second server next to the
            # existing one instead of moving it. Stop before that and say why.
            want="${POSTGRES_LOCATION:-$(az group show -n "$RESOURCE_GROUP" --query location -o tsv)}"
            want="${want,,}"
            # One server per row (id, name), then its location from one scalar
            # read per server. Run #24 read "[0].[name, location]" with -o tsv:
            # az prints a flat list one value per line, so read got the name
            # and an empty location.
            servers="$(az resource list -g "$RESOURCE_GROUP" \
              --resource-type Microsoft.DBforPostgreSQL/flexibleServers \
              --query "[?tags.project=='ats'].[id, name]" -o tsv)"
            pg_name=""
            while IFS=$'\t' read -r pg_id name; do
              [ -n "$pg_id" ] || continue
              if ! pg_location="$(az resource show --ids "$pg_id" --query location -o tsv 2>&1)"; then
                # A create that Azure refused can leave a record that delete
                # and show report as not found. It is no server: skip it.
                if grep -qiE "not ?found|\(404\)" <<< "$pg_location"; then
                  echo "::notice::Ignoring $name: listed, but Azure reports it not found (a record left by a failed create)."
                  continue
                fi
                echo "$pg_location"
                echo "::error::Couldn't read PostgreSQL server $name."
                exit 1
              fi
              pg_location="$(tr -d ' \r\n' <<< "${pg_location,,}")"
              if [ -z "$pg_location" ]; then
                echo "::error::PostgreSQL server $name has no location in ARM; can't tell whether this run would move it."
                exit 1
              fi
              if [ "$pg_location" != "$want" ]; then
                echo "::error::PostgreSQL server $name is in $pg_location, but this run would create another one in $want. A server can't move: set POSTGRES_LOCATION to $pg_location to keep it, or delete it in the portal (its data is lost), then rerun."
                exit 1
              fi
              pg_name="$name"
            done <<< "$servers"
            echo "PostgreSQL region: $want"
            if [ -n "${pg_name:-}" ]; then
              echo "PostgreSQL server: $pg_name"
            else
              # An empty list doesn't prove the name is free: a create refused with
              # SkuNotAvailable can leave a record in ARM that az resource list
              # doesn't show, delete calls report ResourceNotFound and
              # checkNameAvailability reports free, yet a create of that name in
              # another region fails with InvalidResourceLocation. The region in
              # the name keeps such a record from blocking a new region.
              echo "PostgreSQL server: none listed; this run creates ats-pg-$want-… (a failed earlier attempt can leave an unlisted record, see \"Explain a failed deployment\")."
            fi
            for name in $owner; do
              if [[ "$existing" != *" $name "* ]]; then
                echo "::error::Key Vault has no secret $name yet. Add the owner's secrets first (README \"Azure setup\" step 4)."
                exit 1
              fi
            done
            # Never roll the app back: keep the image the web app runs now (Q4).
            web_id="$(az resource list -g "$RESOURCE_GROUP" --resource-type Microsoft.App/containerApps \
              --query "[?tags.project=='ats'].id | [0]" -o tsv)"
            if [ -n "$web_id" ]; then
              image="$(az resource show --ids "$web_id" --query "properties.template.containers[0].image" -o tsv)"
              tag="${image##*:}"
              echo "WEB_APP_EXISTS=true" >> "$GITHUB_ENV"
              echo "Keeping the deployed image tag $tag."
              [ -z "$IMAGE_TAG_INPUT" ] || [ "$IMAGE_TAG_INPUT" = "$tag" ] || \
                echo "::notice::image_tag $IMAGE_TAG_INPUT ignored: the web app already runs $tag (main.yml deploys new images)."
            else
              if [ -z "$IMAGE_TAG_INPUT" ]; then
                echo "::error::The web app doesn't exist yet: set image_tag to the latest SHA in GHCR."
                exit 1
              fi
              tag="$IMAGE_TAG_INPUT"
              echo "WEB_APP_EXISTS=false" >> "$GITHUB_ENV"
            fi
            echo "INFRA_IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          fi

      - name: What-if
        run: |
          az deployment group what-if -g "$RESOURCE_GROUP" --name "infra-${INFRA_STAGE}" \
            --parameters infra/main.bicepparam > what-if.txt
          # Defence in depth: the generated values are masked in the log, and
          # removed from the text before it goes to the job summary.
          for var in INFRA_PG_ADMIN_PASSWORD INFRA_PG_APP_PASSWORD INFRA_BETTER_AUTH_SECRET INFRA_EMAIL_HASH_KEY INFRA_TICK_SECRET; do
            value="${!var:-}"
            [ -z "$value" ] || sed -i "s|${value}|***|g" what-if.txt
          done
          cat what-if.txt
          {
            echo "## What-if: stage \`${INFRA_STAGE}\`, mode \`${INFRA_MODE}\`"
            echo
            echo '```text'
            cat what-if.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy, first full deployment without the web app
        if: inputs.mode == 'deploy' && inputs.stage == 'full' && env.WEB_APP_EXISTS == 'false'
        env:
          INFRA_DEPLOY_WEB_APP: "false"
        run: |
          # The web app exits at start until db-migrate has created the app
          # login, which would fail its first revision. So the first full
          # deployment creates everything else, runs db-migrate, and then
          # deploys the whole template in the next step.
          az deployment group create -g "$RESOURCE_GROUP" --name "infra-full-bootstrap" \
            --parameters infra/main.bicepparam --query "properties.provisioningState" -o tsv \
            2> deploy-error.log || { cat deploy-error.log >&2; exit 1; }
          bash infra/run-job.sh "$(az deployment group show -g "$RESOURCE_GROUP" --name infra-full-bootstrap \
            --query "properties.outputs.migrateJobName.value" -o tsv)"

      - name: Deploy
        if: inputs.mode == 'deploy'
        run: |
          az deployment group create -g "$RESOURCE_GROUP" --name "infra-${INFRA_STAGE}" \
            --parameters infra/main.bicepparam --query "properties.outputs" -o json > outputs.json \
            2> deploy-error.log || { cat deploy-error.log >&2; exit 1; }
          cat outputs.json
          {
            echo "## Deployed: stage \`${INFRA_STAGE}\`"
            echo
            echo '```json'
            cat outputs.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Migrate the database
        if: inputs.mode == 'deploy' && inputs.stage == 'full'
        run: bash infra/run-job.sh "$(jq -r '.migrateJobName.value' outputs.json)"

      - name: Health check
        if: inputs.mode == 'deploy' && inputs.stage == 'full'
        run: |
          url="$(jq -r '.appUrl.value' outputs.json)/api/health"
          # Up to 5 minutes: the first request also wakes a scaled-to-zero app.
          for attempt in $(seq 1 30); do
            code="$(curl -s -o health.json -w '%{http_code}' --max-time 10 "$url" || true)"
            if [ "$code" = "200" ]; then
              echo "GET $url: 200 $(cat health.json)"
              echo "Health: \`GET $url\` returned 200." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt: GET $url returned ${code:-no response}"
            sleep 10
          done
          echo "::error::$url did not return 200 within 5 minutes."
          exit 1

      - name: Explain a failed deployment
        if: failure() && inputs.mode == 'deploy'
        run: |
          [ -f deploy-error.log ] || exit 0
          # A region the subscription may not use for PostgreSQL fails either
          # with SkuNotAvailable or, as in infra run #21 (germanywestcentral),
          # with ParameterOutOfRange "The value of the 'Version' should be in: []".
          if grep -q "SkuNotAvailable" deploy-error.log || grep -q "'Version' should be in: \[\]" deploy-error.log; then
            echo "::error::Azure doesn't offer this subscription the database size (Standard_B1ms) in this region. Set POSTGRES_LOCATION to another EU region that offers it (user-tasks.md step 2.4), then rerun."
          fi
          if grep -q "InvalidResourceLocation" deploy-error.log; then
            echo "::error::ARM says a resource of this name already exists in another region. For the PostgreSQL server this can be a record left by an earlier create that failed (e.g. SkuNotAvailable): az resource list doesn't show it, delete reports ResourceNotFound and checkNameAvailability reports the name free. It can't be removed, but the server name includes the region (ats-pg-<region>-…), so a POSTGRES_LOCATION that hasn't been tried before gets a new name (user-tasks.md step 2.4)."
          fi
